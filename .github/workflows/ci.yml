name: CI

# Runs the full offline test suite on every push and pull request. The suite needs no
# API keys and makes no network calls — LLM_PROVIDER defaults to the deterministic
# sandbox model — so CI is hermetic and free.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the Dockerfile and render.yaml pin; 3.11 guards against
        # accidentally depending on a 3.12-only feature.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          LLM_PROVIDER: sandbox
        run: python -m pytest -q

  build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Proves the image still builds before anyone deploys it. Build only — the
      # image is not pushed anywhere.
      - name: Build image
        run: docker build -t healthcare-agentic-ai-dental:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --name demo -p 8000:8000 healthcare-agentic-ai-dental:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS http://localhost:8000/ | grep -q "Healthcare Agentic AI"
          docker rm -f demo
